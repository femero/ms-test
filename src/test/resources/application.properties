# Test profile. The whole point of this file is that `mvn verify` must run on a laptop
# with no database, no Redis and no Kafka. A test that first asks someone to provision
# infrastructure is not a test.

# The datasource and Hibernate are switched off rather than pointed somewhere fake, so
# nothing tries to open a connection during augmentation or startup. Adapter tests mock
# the repository port instead.
quarkus.datasource.active=false
quarkus.hibernate-orm.active=false

# Kafka channels are swapped for SmallRye's in-memory connector. Same consumer code, same
# mapper, same use case - only the transport changes.

# The main application.yaml declares every connection value as ${NAME} with no default,
# on purpose: a missing one must stop the application. Tests still have to satisfy that
# contract, so placeholders are supplied here. None of them is ever dialled.
DB_URL=jdbc:postgresql://unused/unused
DB_USERNAME=unused
DB_PASSWORD=unused
REDIS_HOSTS=redis://unused:6379
KAFKA_BOOTSTRAP_SERVERS=unused:9092
KAFKA_API_KEY=unused
KAFKA_API_SECRET=unused
SCHEMA_REGISTRY_URL=http://unused
SCHEMA_REGISTRY_API_KEY=unused
SCHEMA_REGISTRY_API_SECRET=unused
KAFKA_TOPIC_PAYMENTS_IN=payments-in
KAFKA_TOPIC_PAYMENTS_DLQ=payments-dlq
KAFKA_TOPIC_CORE_TRANSACTIONS_IN=core-transactions-in
KAFKA_TOPIC_CORE_TRANSACTIONS_DLQ=core-transactions-dlq
KAFKA_TOPIC_RESULTS_OUT=results-out
KAFKA_TOPIC_DISCREPANCIES_OUT=discrepancies-out

quarkus.log.level=WARN

# The in-memory connector lives in a third-party jar, so Quarkus does not index it for CDI
# discovery by default and its InMemorySource/InMemorySink producers stay invisible.
quarkus.index-dependency.inmemory.group-id=io.smallrye.reactive
quarkus.index-dependency.inmemory.artifact-id=smallrye-reactive-messaging-in-memory
